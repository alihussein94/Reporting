<style>
:root {
  --brand: #0d5c57; --bg: #f4f5f2; --card: #ffffff; --ink: #1b1f1d; --muted: #66706b; --line: #dfe3df;
  --bad: #b3261e; --bad-bg: #fbe9e7; --warn: #8a5a00; --warn-bg: #fff3d6; --ok: #1d6b3a; --ok-bg: #e3f3e8;
  --info-bg: #e6f0ef; --radius: 14px;
  font-family: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
}
:root:not([data-theme="light"]) { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { min-height: 100vh; font-size: 16px; line-height: 1.45; }
[dir="rtl"] body { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif; }
#app { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 12px; }
.brand { display: flex; gap: 12px; align-items: center; }
.brand .dot { width: 38px; height: 38px; border-radius: 11px; background: var(--brand); flex: none; box-shadow: inset 0 0 0 3px rgba(255,255,255,.25); }
.brand b { display: block; font-size: 17px; }
.brand small { color: var(--muted); font-size: 12.5px; }
.lang { border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.tabs { display: flex; gap: 6px; background: #e8ebe7; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 9px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.intro { background: var(--info-bg); border-inline-start: 4px solid var(--brand); padding: 12px 14px; border-radius: 10px; font-size: 14.5px; margin-bottom: 14px; }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sec-head span { color: var(--muted); font-size: 13px; order: 2; }
.sec-head h2 { margin: 0; font-size: 20px; }
.bar { height: 4px; background: #eceeea; border-radius: 4px; margin: 12px 0 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); transition: width .25s; }
.f { margin-top: 18px; }
.fl { display: block; font-weight: 600; margin-bottom: 7px; }
.req { color: var(--bad); }
input[type=text], input[type=tel], input[type=date], textarea, select {
  width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #c9cfca; border-radius: 10px; background: #fff; color: var(--ink);
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
textarea { resize: vertical; min-height: 96px; }
.hint { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
.warn { display: block; color: var(--warn); font-size: 13px; margin-top: 4px; }
.warn:empty, .err:empty { display: none; }
.err { display: block; color: var(--bad); font-size: 13px; margin-top: 6px; font-weight: 600; }
.f.bad input, .f.bad textarea, .f.bad select, .f.bad .opts { border-color: var(--bad); }
.opts { display: grid; gap: 8px; border-radius: 10px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: #fff; }
.opt:has(input:checked) { border-color: var(--brand); background: var(--info-bg); }
.opt input { width: 19px; height: 19px; accent-color: var(--brand); margin: 0; flex: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two .f { margin-top: 18px; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.btn { border: 0; background: var(--brand); color: #fff; font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 11px; cursor: pointer; min-width: 110px; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; min-width: 0; font-size: 14px; }
.btn.send { flex: 1; }
.btn:disabled { opacity: .6; }
.card-in { border-radius: 10px; padding: 12px 14px; margin-top: 16px; }
.card-in.good { background: var(--ok-bg); } .card-in.part { background: var(--warn-bg); }
.mins { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 3px; }
.mins .y { color: var(--ok); } .mins .n { color: var(--warn); }
.done { text-align: center; }
.done .big { font-size: 46px; line-height: 1; margin: 6px 0 8px; color: var(--brand); }
.done .alert { background: var(--bad-bg); color: var(--bad); padding: 10px; border-radius: 10px; font-weight: 600; }
.ref { font-family: "IBM Plex Mono", monospace; letter-spacing: .3px; }
.mine { margin-top: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row small { display: block; color: var(--muted); font-size: 12.5px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: #eceeea; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.info { background: var(--info-bg); color: var(--brand); }
.pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.muted { color: var(--muted); }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1b1f1d; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } .two .f + .f { margin-top: 0; } }
.emerg { background: var(--bad-bg); color: #5c1410; border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
.emerg a { color: var(--bad); font-weight: 700; }
.done a { color: inherit; font-weight: 700; }
.hp { position: absolute; inset-inline-start: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); opacity: 0; pointer-events: none; white-space: nowrap; }
.privacy { margin-top: 14px; }

/* ---------- responsive: phones, tablets, desktop, notches ---------- */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
#app { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.top { padding-top: max(18px, env(safe-area-inset-top)); flex-wrap: wrap; }
.brand { min-width: 0; flex: 1 1 200px; }
.brand > div { min-width: 0; }
.brand b, .brand small, .fl, .opt span, .row b, .row small, .intro, .emerg, .hint, .ref { overflow-wrap: anywhere; }
.lang { flex: none; min-height: 40px; }
.f, .two > *, .opts > *, .row > * { min-width: 0; }
input[type=text], input[type=tel], input[type=date], textarea, select { min-height: 46px; font-size: 16px; max-width: 100%; }
input[type=date] { -webkit-appearance: none; appearance: none; display: block; text-align: start; background: #fff; }
input[type=date]::-webkit-date-and-time-value { text-align: start; }
input[type=date]::-webkit-calendar-picker-indicator { opacity: .7; }
select { -webkit-appearance: menulist; }
.opt { min-height: 48px; }
.btn { min-height: 48px; }
.tabs button { min-height: 42px; }
.emerg a { white-space: nowrap; }
/* phones: keep Back / Next within thumb reach */
@media (max-width: 599px) {
  .nav { position: sticky; bottom: 0; z-index: 5; margin: 12px calc(-1 * max(16px, env(safe-area-inset-left))) 0; padding: 8px max(16px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
         background: var(--bg); border-top: 1px solid rgba(0,0,0,.08); box-shadow: 0 -4px 12px rgba(0,0,0,.05); }
  .card { padding: 16px 14px; }
  .sec-head h2 { font-size: 18px; }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom)); }
  .done .nav { position: static; background: none; margin: 16px 0 0; padding: 0; }
}
@media (max-width: 360px) {
  body { font-size: 15px; }
  .btn { padding: 12px 14px; min-width: 0; }
  .brand .dot { width: 32px; height: 32px; }
}
/* tablets and desktop: roomier, options side by side */
@media (min-width: 600px) {
  .opts { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { padding: 22px 24px; }
}
@media (min-width: 1000px) {
  #app { max-width: 760px; }
  .top { padding-top: 28px; padding-bottom: 18px; }
  .brand b { font-size: 19px; }
  .sec-head h2 { font-size: 22px; }
}
/* short landscape phones */
@media (max-height: 480px) and (orientation: landscape) {
  .nav { position: static; background: none; }
  .top { padding-top: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* training page */
.head h1 { font-size: 20px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.head .times { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-top: 6px; }
main .card + .card, .card.head + main .card { margin-top: 12px; }
.card.head { margin-bottom: 12px; }
.code { font: 600 26px "IBM Plex Mono", monospace !important; letter-spacing: 8px; text-align: center; }
.fl + input, .fl + textarea { margin-bottom: 4px; }
.card .fl { margin-top: 14px; }
.card .opt { margin-top: 14px; }
.card .btn { width: 100%; margin-top: 16px; }
.err { color: var(--bad); font-size: 14px; font-weight: 600; margin-top: 10px; }
.err:empty { display: none; }
.count { font: 600 34px "IBM Plex Mono", monospace; color: var(--brand); margin: 6px 0 4px; direction: ltr; }
.video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; margin: 10px 0; }
.video iframe, .video #yt { position: absolute; inset: 0; width: 100%; height: 100%; }
.q { padding: 14px 0; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: 0; }
.big.ok { color: var(--ok); } .big.bad { color: var(--bad); }
h2 { font-size: 18px; margin: 0 0 6px; }
/* study material, exam integrity */
body.protect main, body.protect .head { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.wm { position: fixed; inset: -20%; z-index: 50; pointer-events: none; display: flex; flex-wrap: wrap; gap: 70px 90px; align-content: flex-start;
      transform: rotate(-24deg); opacity: .07; font: 600 15px "IBM Plex Sans", sans-serif; color: #000; overflow: hidden; }
.wm span { white-space: nowrap; }
@media print { body * { display: none !important; } body::after { content: "—"; } }
.slides { margin-top: 12px; }
.slide-box { background: #f0f2ef; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 180px; display: grid; place-items: center; }
.slide-img { display: block; width: 100%; height: auto; pointer-events: none; }
.slide-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.card .slide-nav .btn { width: auto; margin-top: 0; min-width: 110px; }
.slide-count { font: 600 15px "IBM Plex Mono", monospace; color: var(--muted); direction: ltr; }
.mins { margin-top: 14px; font-size: 14px; }
.rules { padding-inline-start: 20px; display: grid; gap: 8px; font-size: 15px; }
.clock { font: 700 22px "IBM Plex Mono", monospace; color: var(--brand); }
.bar.timer { height: 6px; }
.bar.timer.low i { background: var(--bad); }
.bar.timer i { transition: width .25s linear; }
.qtext { font-size: 17px; margin: 14px 0 12px; line-height: 1.6; }
.opts.one { grid-template-columns: 1fr; }
.leave-warn { position: fixed; inset: 0; z-index: 60; background: rgba(20,24,22,.55); display: grid; place-items: center; padding: 16px; }
.leave-warn > div { background: #fff; border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; border-top: 5px solid var(--bad); }
.leave-warn b { color: var(--bad); font-size: 17px; }
.leave-warn .btn { width: 100%; margin-top: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: #0d5c57; text-decoration: underline; font: inherit; cursor: pointer; }
.linkbtn:disabled { color: #9aa3a0; text-decoration: none; cursor: default; }
.row-links { margin-top: 12px; font-size: 14px; color: #6b7572; text-align: center; }


/* lecture: watched map, live status, jump, resume, celebration */
.wmap { display: flex; height: 14px; gap: 1px; margin: 12px 0 6px; border-radius: 6px; overflow: hidden; background: #e4e7e3; cursor: pointer; direction: ltr; }
.wmap i { flex: 1; background: #d5dad5; transition: background .3s; }
.wmap i.half { background: #9cc9b0; } .wmap i.on { background: var(--ok); }
.wline { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.wline b { color: var(--ink); font-size: 16px; }
.wleft { font-weight: 600; color: var(--warn); } .wleft.ok { color: var(--ok); }
.wstatus { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #eef0ed; color: var(--muted); }
.wstatus .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
.wstatus.live { background: var(--ok-bg); color: var(--ok); } .wstatus.live .dot { animation: wpulse 1.1s infinite; }
.wstatus.paused { background: var(--warn-bg); color: var(--warn); }
.wstatus.again, .wstatus.skip { background: var(--info-bg); color: var(--brand); }
@keyframes wpulse { 0% { box-shadow: 0 0 0 0 rgba(29,107,58,.55); } 70% { box-shadow: 0 0 0 9px rgba(29,107,58,0); } 100% { box-shadow: 0 0 0 0 rgba(29,107,58,0); } }
.wjump { width: 100%; margin-top: 10px; }
.wresume { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--info-bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-weight: 600; }
.wresume span { flex: 1; min-width: 140px; }
.wdone { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(13,92,87,.92); color: #fff; text-align: center; padding: 16px; animation: wfade .35s ease; z-index: 2; }
.wdone .tick { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: var(--ok); font-size: 38px; font-weight: 800; display: grid; place-items: center; animation: wpop .5s ease; }
.wdone b { font-size: 17px; } .wdone span { font-size: 14px; opacity: .9; }
[hidden] { display: none !important; }
@keyframes wfade { from { opacity: 0; } } @keyframes wpop { 0% { transform: scale(.3); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.btn.pulse:not(:disabled) { animation: bpulse 1.4s infinite; }
@keyframes bpulse { 0% { box-shadow: 0 0 0 0 rgba(13,92,87,.5); } 70% { box-shadow: 0 0 0 12px rgba(13,92,87,0); } 100% { box-shadow: 0 0 0 0 rgba(13,92,87,0); } }
.wresume .btn { width: auto; min-width: 0; flex: none; padding: 8px 14px; }

</style>

2F\u0631\u064A\u0628 \u0641\u064A","Go to the exam":"\u0627\u0644\u0627\u0646\u062A\u0642\u0627\u0644 \u0625\u0644\u0649 \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646","of the lecture":"\u0645\u0646 \u0627\u0644\u0645\u062D\u0627\u0636\u0631\u0629","Read all the slides to the end":"\u0627\u0642\u0631\u0623 \u0643\u0644 \u0627\u0644\u0633\u0644\u0627\u064A\u062F\u0627\u062A \u062D\u062A\u0649 \u0627\u0644\u0646\u0647\u0627\u064A\u0629","Self-study":"\u062F\u0631\u0627\u0633\u0629 \u0630\u0627\u062A\u064A\u0629","The slides are not uploaded yet \u2014 contact the LSR.":"\u0627\u0644\u0633\u0644\u0627\u064A\u062F\u0627\u062A \u063A\u064A\u0631 \u0645\u0631\u0641\u0648\u0639\u0629 \u0628\u0639\u062F \u2014 \u062A\u0648\u0627\u0635\u0644 \u0645\u0639 \u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u064A\u0642\u0638\u0629.",Previous:"\u0627\u0644\u0633\u0627\u0628\u0642",Next:"\u0627\u0644\u062A\u0627\u0644\u064A","Last slide":"\u0622\u062E\u0631 \u0633\u0644\u0627\u064A\u062F","Read this slide a little longer.":"\u0627\u0642\u0631\u0623 \u0647\u0630\u0627 \u0627\u0644\u0633\u0644\u0627\u064A\u062F \u0644\u0648\u0642\u062A \u0623\u0637\u0648\u0644 \u0642\u0644\u064A\u0644\u0627\u064B.","Each slide stays at least":"\u0643\u0644 \u0633\u0644\u0627\u064A\u062F \u064A\u0628\u0642\u0649 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644","seconds before the next one opens.":"\u062B\u0627\u0646\u064A\u0629 \u0642\u0628\u0644 \u0623\u0646 \u064A\u0641\u062A\u062D \u0627\u0644\u062A\u0627\u0644\u064A.","You left the exam page":"\u0644\u0642\u062F \u063A\u0627\u062F\u0631\u062A \u0635\u0641\u062D\u0629 \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646","This is recorded and the LSR will see it. Stay on this page until you finish the exam.":"\u062A\u0645 \u062A\u0633\u062C\u064A\u0644 \u0630\u0644\u0643 \u0648\u0633\u064A\u0637\u0651\u0644\u0639 \u0639\u0644\u064A\u0647 \u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u064A\u0642\u0638\u0629. \u0627\u0628\u0642\u064E \u0641\u064A \u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062D\u0629 \u062D\u062A\u0649 \u062A\u0646\u0647\u064A \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646.",OK:"\u062D\u0633\u0646\u0627\u064B",questions:"\u0623\u0633\u0626\u0644\u0629","seconds for each question. When the time ends the question counts as not answered.":"\u062B\u0627\u0646\u064A\u0629 \u0644\u0643\u0644 \u0633\u0624\u0627\u0644. \u0639\u0646\u062F \u0627\u0646\u062A\u0647\u0627\u0621 \u0627\u0644\u0648\u0642\u062A \u064A\u064F\u062D\u0633\u0628 \u0627\u0644\u0633\u0624\u0627\u0644 \u0628\u062F\u0648\u0646 \u0625\u062C\u0627\u0628\u0629.","One question at a time. After you answer you cannot go back.":"\u0633\u0624\u0627\u0644 \u0648\u0627\u062D\u062F \u0641\u064A \u0643\u0644 \u0645\u0631\u0629\u060C \u0648\u0644\u0627 \u064A\u0645\u0643\u0646 \u0627\u0644\u0631\u062C\u0648\u0639 \u0628\u0639\u062F \u0627\u0644\u0625\u062C\u0627\u0628\u0629.","Do not leave this page during the exam (other tabs, apps or windows). Leaving is recorded and the LSR will see it.":"\u0644\u0627 \u062A\u063A\u0627\u062F\u0631 \u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062D\u0629 \u0623\u062B\u0646\u0627\u0621 \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646 (\u062A\u0628\u0648\u064A\u0628\u0627\u062A \u0623\u0648 \u062A\u0637\u0628\u064A\u0642\u0627\u062A \u0623\u0648 \u0646\u0648\u0627\u0641\u0630 \u0623\u062E\u0631\u0649). \u0627\u0644\u0645\u063A\u0627\u062F\u0631\u0629 \u062A\u064F\u0633\u062C\u064E\u0651\u0644 \u0648\u064A\u0637\u0651\u0644\u0639 \u0639\u0644\u064A\u0647\u0627 \u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u064A\u0642\u0638\u0629.","You cannot go back to the study material once the exam starts.":"\u0644\u0627 \u064A\u0645\u0643\u0646 \u0627\u0644\u0631\u062C\u0648\u0639 \u0625\u0644\u0649 \u0627\u0644\u0645\u0627\u062F\u0629 \u0627\u0644\u062F\u0631\u0627\u0633\u064A\u0629 \u0628\u0639\u062F \u0628\u062F\u0621 \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646.","Try again":"\u062D\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062E\u0631\u0649","Next question":"\u0627\u0644\u0633\u0624\u0627\u0644 \u0627\u0644\u062A\u0627\u0644\u064A","Finish the exam":"\u0625\u0646\u0647\u0627\u0621 \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646","The LSR will send you a new date and code to repeat the training.":"\u0633\u064A\u0631\u0633\u0644 \u0644\u0643 \u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u064A\u0642\u0638\u0629 \u0645\u0648\u0639\u062F\u0627\u064B \u0648\u0631\u0645\u0632\u0627\u064B \u062C\u062F\u064A\u062F\u064A\u0646 \u0644\u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u062A\u062F\u0631\u064A\u0628.","Pharmacovigilance training":"\u062A\u062F\u0631\u064A\u0628 \u0627\u0644\u064A\u0642\u0638\u0629 \u0627\u0644\u062F\u0648\u0627\u0626\u064A\u0629","Loading\u2026":"\u062C\u0627\u0631\u064D \u0627\u0644\u062A\u062D\u0645\u064A\u0644\u2026","This training link is not valid. Ask the LSR for your link.":"\u0631\u0627\u0628\u0637 \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u063A\u064A\u0631 \u0635\u062D\u064A\u062D. \u0627\u0637\u0644\u0628 \u0631\u0627\u0628\u0637\u0643 \u0645\u0646 \u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u064A\u0642\u0638\u0629.","The training opens in":"\u064A\u0628\u062F\u0623 \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u0628\u0639\u062F",Opens:"\u064A\u0628\u062F\u0623",Closes:"\u064A\u0646\u062A\u0647\u064A",days:"\u064A\u0648\u0645",Retraining:"\u0625\u0639\u0627\u062F\u0629 \u062A\u062F\u0631\u064A\u0628","Enter your code":"\u0623\u062F\u062E\u0644 \u0631\u0645\u0632\u0643","The 6-digit code from your invitation e-mail.":"\u0627\u0644\u0631\u0645\u0632 \u0627\u0644\u0645\u0643\u0648\u0646 \u0645\u0646 6 \u0623\u0631\u0642\u0627\u0645 \u0627\u0644\u0645\u0648\u062C\u0648\u062F \u0641\u064A \u0625\u064A\u0645\u064A\u0644 \u0627\u0644\u062F\u0639\u0648\u0629.","Your full name (signature)":"\u0627\u0633\u0645\u0643 \u0627\u0644\u0643\u0627\u0645\u0644 (\u062A\u0648\u0642\u064A\u0639)","I confirm that I am attending this training myself.":"\u0623\u0642\u0631 \u0628\u0623\u0646\u0646\u064A \u0623\u062D\u0636\u0631 \u0647\u0630\u0627 \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u0628\u0646\u0641\u0633\u064A.","Sign in to the training":"\u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062D\u0636\u0648\u0631","Wrong code":"\u0627\u0644\u0631\u0645\u0632 \u063A\u064A\u0631 \u0635\u062D\u064A\u062D","tries left":"\u0645\u062D\u0627\u0648\u0644\u0627\u062A \u0645\u062A\u0628\u0642\u064A\u0629","Too many wrong codes. Ask the LSR for a new code.":"\u0645\u062D\u0627\u0648\u0644\u0627\u062A \u062E\u0627\u0637\u0626\u0629 \u0643\u062B\u064A\u0631\u0629. \u0627\u0637\u0644\u0628 \u0631\u0645\u0632\u0627\u064B \u062C\u062F\u064A\u062F\u0627\u064B \u0645\u0646 \u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u064A\u0642\u0638\u0629.","Type your full name and tick the confirmation.":"\u0627\u0643\u062A\u0628 \u0627\u0633\u0645\u0643 \u0627\u0644\u0643\u0627\u0645\u0644 \u0648\u0623\u0634\u0651\u0631 \u0639\u0644\u0649 \u0627\u0644\u0625\u0642\u0631\u0627\u0631.","Tap a grey part to go to it":"\u0627\u0636\u063A\u0637 \u0639\u0644\u0649 \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0631\u0645\u0627\u062F\u064A \u0644\u0644\u0627\u0646\u062A\u0642\u0627\u0644 \u0625\u0644\u064A\u0647","Press play \u2014 the watching is counted while the video plays":"\u0634\u063A\u0651\u0644 \u0627\u0644\u0641\u064A\u062F\u064A\u0648 \u2014 \u062A\u064F\u062D\u062A\u0633\u0628 \u0627\u0644\u0645\u0634\u0627\u0647\u062F\u0629 \u0623\u062B\u0646\u0627\u0621 \u0627\u0644\u062A\u0634\u063A\u064A\u0644","Well done \u2014 you watched enough of the lecture":"\u0623\u062D\u0633\u0646\u062A \u2014 \u0634\u0627\u0647\u062F\u062A \u0645\u0627 \u064A\u0643\u0641\u064A \u0645\u0646 \u0627\u0644\u0645\u062D\u0627\u0636\u0631\u0629","The exam is open now":"\u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646 \u0645\u0641\u062A\u0648\u062D \u0627\u0644\u0622\u0646","Enough watched":"\u0627\u0643\u062A\u0645\u0644\u062A \u0627\u0644\u0645\u0634\u0627\u0647\u062F\u0629 \u0627\u0644\u0645\u0637\u0644\u0648\u0628\u0629","Left to open the exam":"\u0645\u062A\u0628\u0642\u064D \u0644\u0641\u062A\u062D \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646","Go to the part you have not watched":"\u0627\u0646\u062A\u0642\u0644 \u0625\u0644\u0649 \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0630\u064A \u0644\u0645 \u062A\u0634\u0627\u0647\u062F\u0647","Continue from":"\u0646\u0643\u0645\u0644 \u0645\u0646",Continue:"\u0646\u0643\u0645\u0644","From the start":"\u0645\u0646 \u0627\u0644\u0628\u062F\u0627\u064A\u0629","Skipping ahead is not counted \u2014 watch the part":"\u0627\u0644\u062A\u0642\u062F\u064A\u0645 \u0644\u0627 \u064A\u064F\u062D\u062A\u0633\u0628 \u2014 \u0634\u0627\u0647\u062F \u0627\u0644\u062C\u0632\u0621","Counting\u2026 keep watching":"\u062C\u0627\u0631\u064D \u0627\u0644\u0627\u062D\u062A\u0633\u0627\u0628\u2026 \u0627\u0633\u062A\u0645\u0631 \u0628\u0627\u0644\u0645\u0634\u0627\u0647\u062F\u0629","You watched this part before \u2014 it is not counted again":"\u0634\u0627\u0647\u062F\u062A \u0647\u0630\u0627 \u0627\u0644\u062C\u0632\u0621 \u0645\u0646 \u0642\u0628\u0644 \u2014 \u0644\u0627 \u064A\u064F\u062D\u062A\u0633\u0628 \u0645\u0631\u0629 \u062B\u0627\u0646\u064A\u0629","The video ended":"\u0627\u0646\u062A\u0647\u0649 \u0627\u0644\u0641\u064A\u062F\u064A\u0648","Loading the video\u2026":"\u062C\u0627\u0631\u064D \u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u0641\u064A\u062F\u064A\u0648\u2026","The video is paused \u2014 play it to continue counting":"\u0627\u0644\u0641\u064A\u062F\u064A\u0648 \u0645\u062A\u0648\u0642\u0641 \u2014 \u0634\u063A\u0651\u0644\u0647 \u0644\u064A\u0633\u062A\u0645\u0631 \u0627\u0644\u0627\u062D\u062A\u0633\u0627\u0628",Lecture:"\u0627\u0644\u0645\u062D\u0627\u0636\u0631\u0629",Watched:"\u062A\u0645\u062A \u0645\u0634\u0627\u0647\u062F\u0629","Watch at least":"\u0634\u0627\u0647\u062F \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644","of the lecture to open the exam.":"\u0645\u0646 \u0627\u0644\u0645\u062D\u0627\u0636\u0631\u0629 \u0644\u0641\u062A\u062D \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646.","Start the exam":"\u0627\u0628\u062F\u0623 \u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646",Exam:"\u0627\u0644\u0627\u0645\u062A\u062D\u0627\u0646","Pass mark":"\u062F\u0631\u062C\u0629 \u0627\u0644\u0646\u062C\u0627\u062D","Submit answers":"\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u0625\u062C\u0627\u0628\u0627\u062A","Answer all the questions first.":"\u0623\u062C\u0628 \u0639\u0644\u0649 \u0643\u0644 \u0627\u0644\u0623\u0633\u0626\u0644\u0629 \u0623\u0648\u0644\u0627\u064B.","Submit your answers? You cannot change them afterwards.":"\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u0625\u062C\u0627\u0628\u0627\u062A\u061F \u0644\u0627 \u064A\u0645\u0643\u0646 \u062A\u063A\u064A\u064A\u0631\u0647\u0627 \u0628\u0639\u062F \u0627\u0644\u0625\u0631\u0633\u0627\u0644.",Passed:"\u0646\u0627\u062C\u062D","Not passed":"\u0644\u0645 \u062A\u0646\u062C\u062D","Your score":"\u062F\u0631\u062C\u062A\u0643","Well done \u2014 your training is recorded.":"\u0623\u062D\u0633\u0646\u062A \u2014 \u062A\u0645 \u062A\u0633\u062C\u064A\u0644 \u062A\u062F\u0631\u064A\u0628\u0643.","You will receive an e-mail with a new date and code to repeat the training.":"\u0633\u064A\u0635\u0644\u0643 \u0625\u064A\u0645\u064A\u0644 \u0628\u0645\u0648\u0639\u062F \u0648\u0631\u0645\u0632 \u062C\u062F\u064A\u062F\u064A\u0646 \u0644\u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u062A\u062F\u0631\u064A\u0628.","The LSR will contact you to arrange the retraining.":"\u0633\u064A\u062A\u0648\u0627\u0635\u0644 \u0645\u0639\u0643 \u0645\u0633\u0624\u0648\u0644 \u0627\u0644\u064A\u0642\u0638\u0629 \u0644\u062A\u0631\u062A\u064A\u0628 \u0625\u0639\u0627\u062F\u0629 \u0627\u0644\u062A\u062F\u0631\u064A\u0628.","This training is closed.":"\u0647\u0630\u0627 \u0627\u0644\u062A\u062F\u0631\u064A\u0628 \u0627\u0646\u062A\u0647\u0649.","This training was cancelled.":"\u062A\u0645 \u0625\u0644\u063A\u0627\u0621 \u0647\u0630\u0627
